<!DOCTYPE html>
<head>
        <title>this is a layout page</title>
        <style>
            .container{
                display: flex;
                background-color: blue;
                padding:15px;
                justify-content: center;
                height: 200px;
                align-items: flex-end;
                flex-wrap:wrap;
                gap:30px;
            }
            .container div{
                background-color: green;
                padding:10px;
                margin:5px;
                
            }
            .position{
                background-color: red;
                width: 250px;
                height:100px;
                margin-top:50px;
                position: fixed;
            }
        </style>
       
</head>
<body>
    <div class="container">
        <div>Item 1</div>
        <div>Item 2</div>
        <div>Item 3</div>
        <div>Item 4</div>
        <div>Item 5</div>
        <div>Item 6</div>
        <div>Item 7</div>
        <div>Item 8</div>
        <div>Item 9</div>
    </div>
    <div class="position">test for position</div>

</body>
</html>
