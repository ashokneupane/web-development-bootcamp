<!DOCTYPE html>
<head>
        <title>this is a layout page</title>
        <style>
            .container{
                display: grid;
                grid-template-columns: 1fr 1fr 1fr 1fr; 
                /* fr means fraction */
                column-gap: 40px;
            }
            .box{
                background-color: green;
                padding:20px;
                /* margin:10px; */
            }
        </style>
</head>
<body>

    <div class="container">
        <div class="box">item 1</div>
        <div class="box">item 2</div>
        <div class="box">item 3</div>
        <div class="box">item 4</div>

    </div>
</body>
</html>
