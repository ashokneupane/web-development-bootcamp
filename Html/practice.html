<!doctype html>
<html>
  <head>
    <title>My Student Page</title>
  </head>

  <body>
    <h1>My Student Page</h1>

    <p>Welcome to my webpage.</p>

    <h2>Student Table</h2>

    <table border="1">
      <tr>
        <th>Name</th>
        <th>Course</th>
      </tr>
      <tr>
        <td>John</td>
        <td>Web Development</td>
      </tr>
      <tr>
        <td>Sara</td>
        <td>IT</td>
      </tr>
    </table>

    <h2>Student Form</h2>

    <form>
      <label>Name:</label>
      <input type="text" />

      <br /><br />

      <label>Email:</label>
      <input type="email" />

      <br /><br />

      <label>Gender:</label>
      <input type="radio" name="gender" /> Male
      <input type="radio" name="gender" /> Female

      <br /><br />

      <label>Course:</label>

      <select>
        <option>Web Development</option>
        <option>IT</option>
      </select>

      <br /><br />

      <button type="submit">Submit</button>
    </form>
  </body>
</html>
